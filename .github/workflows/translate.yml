name: Translate with Vantage

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the client
        run: pip install -e .

      - name: Upload and download translations
        run: vantage-translate --input source-lang --output translated
        env:
          VANTAGE_API_TOKEN: ${{ secrets.VANTAGE_API_TOKEN }}
          VANTAGE_PROJECT_ID: ${{ vars.VANTAGE_PROJECT_ID }}

      - name: Open a pull request with the translations
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$BASE_BRANCH" == translations/* ]]; then
            echo "Skipping. ${BASE_BRANCH} is already a translation branch."
            exit 0
          fi

          head_branch="translations/${BASE_BRANCH}"
          git checkout -B "$head_branch"
          git add -f translated
          if git diff --cached --quiet; then
            echo "No translation changes to commit."
            exit 0
          fi

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Add translations for ${BASE_BRANCH}."

          git fetch origin "$head_branch" || true
          git push --force-with-lease origin "HEAD:${head_branch}"

          if gh pr view "$head_branch" --json url --jq .url; then
            echo "Updated the open pull request."
          else
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$head_branch" \
              --title "Translations for ${BASE_BRANCH}" \
              --body "$(cat <<EOF
          ## Summary
          - Adds the Vantage translations for \`${BASE_BRANCH}\`.
          - The source files came from \`source-lang/\` on that branch.
          EOF
          )"
          fi
