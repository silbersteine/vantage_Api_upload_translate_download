name: Translate with Vantage

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the client
        run: pip install -e .

      - name: Upload and download changed files
        id: translate
        env:
          VANTAGE_API_TOKEN: ${{ secrets.VANTAGE_API_TOKEN }}
          VANTAGE_PROJECT_ID: ${{ vars.VANTAGE_PROJECT_ID }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nocasematch
          if [[ "$BASE_BRANCH" == translations/* ]]; then
            echo "Skipping. ${BASE_BRANCH} is already a translation branch."
            echo "translated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$BASE_BRANCH" == "master" ]]; then
            if ! git rev-parse --verify --quiet HEAD~1 >/dev/null; then
              echo "master has no previous commit to compare."
              echo "translated=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Comparing master with its previous commit."
            mapfile -t changed < <(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD -- source-lang)
          else
            git fetch origin master
            echo "Comparing ${BASE_BRANCH} with master."
            mapfile -t changed < <(git diff --name-only --diff-filter=ACMR origin/master...HEAD -- source-lang)
          fi

          inputs=()
          for file in "${changed[@]+"${changed[@]}"}"; do
            [[ -f "$file" ]] || continue
            case "$file" in
              *.docx|*.pptx|*.xlsx|*.html|*.htm|*.md|*.markdown|*.idml)
                inputs+=(--input "$file")
                echo "Changed: $file"
                ;;
            esac
          done

          if [[ ${#inputs[@]} -eq 0 ]]; then
            echo "No changed source files to translate."
            echo "translated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          vantage-translate "${inputs[@]}" --output translated
          echo "translated=true" >> "$GITHUB_OUTPUT"

      - name: Open a pull request with the translations
        if: steps.translate.outputs.translated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ "$BASE_BRANCH" == translations/* ]]; then
            echo "Skipping. ${BASE_BRANCH} is already a translation branch."
            exit 0
          fi

          head_branch="translations/${BASE_BRANCH}-${RUN_ID}-${RUN_ATTEMPT}"
          git checkout -B "$head_branch"
          git add -f translated
          if git diff --cached --quiet; then
            echo "No translation changes to commit."
            exit 0
          fi

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Add translations for ${BASE_BRANCH}."

          git push -u origin "HEAD:${head_branch}"

          if gh pr view "$head_branch" --json url --jq .url; then
            echo "Updated the open pull request."
          else
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$head_branch" \
              --title "Translations for ${BASE_BRANCH}" \
              --body "$(cat <<EOF
          ## Summary
          - Adds the Vantage translations for \`${BASE_BRANCH}\`.
          - The source files came from \`source-lang/\` on that branch.
          EOF
          )"
          fi
